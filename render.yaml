services:
  - type: web
    name: wearo-studio
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PAYMENT_MODE
        value: demo
      - key: ADMIN_API_KEY
        generateValue: true

